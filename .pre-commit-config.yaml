repos:
  # C code formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v18.1.8"
    hooks:
      - id: clang-format
        types: [c]
        files: ^src/.*\.(c|h)$
        args: [--style=file]

  # Local hooks using system tools
  - repo: local
    hooks:
      - id: meerkat-format-check
        name: Meerkat C Format Check
        entry: clang-format
        language: system
        files: ^src/.*\.(c|h)$
        args: [--dry-run, --Werror]
        pass_filenames: true

      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        files: ^src/.*\.c$
        args: [-p=builddir, --config-file=.clang-tidy]
        pass_filenames: true
        require_serial: true

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        args: [-x]
        require_serial: false

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.patch$|test/expected/.*\.out$|test/sql/.*\.sql$)
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint.json]
