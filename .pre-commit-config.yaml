repos:
  # C code formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v21.1.8"
    hooks:
      - id: clang-format
        types: [c]
        files: ^(src|test)/.*\.(c|h)$
        args: [--style=file]

  # Local hooks using system tools
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        files: ^src/.*\.c$
        # distance_neon.c is ARM-only, so an x86 build has no compile command
        # for it. clang-tidy does not skip such a file -- it infers flags from
        # a sibling entry and then fails to parse the NEON intrinsics -- so it
        # stays excluded until lint runs somewhere those flags are real.
        exclude: ^src/algo/distance_neon\.c$
        args: [-p=builddir, --config-file=.clang-tidy]
        pass_filenames: true
        require_serial: true

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        args: [-x]
        require_serial: false

      - id: readme-badges
        name: readme badges
        entry: ./scripts/ci/check-readme-badges.sh
        language: system
        files: ^(README\.md|\.github/workflows/.*\.yml)$
        pass_filenames: false

      - id: license-headers
        name: license headers
        entry: ./scripts/ci/check-license-headers.sh
        language: system
        files: \.(c|h)$
        pass_filenames: true

      - id: commit-message-attribution
        name: commit message AI attribution
        entry: ./scripts/ci/check-commit-messages.sh
        language: system
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.patch$|test/(.+/)?expected/.*\.out$|test/(.+/)?sql/.*\.sql$)
      - id: end-of-file-fixer
        exclude: (\.patch$|test/(.+/)?expected/.*\.out$)
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending

  # SQL linting (uses libpg_query — real PostgreSQL parser)
  - repo: https://github.com/sbdchd/squawk
    rev: "v2.60.0"
    hooks:
      - id: squawk
        files: ^(sql|test/(.+/)?(sql|compat))/.*\.sql$
        # The extension install script and upgrade scripts are DDL, not
        # migrations — squawk's migration rules don't apply (they get a
        # pgspot audit in CI instead). prism.sql and mutations.sql use
        # psql metacommands (\c, \i), which squawk's server-grammar
        # parser cannot represent — and an unparseable file gets no rule
        # coverage anyway; pg_regress executes every statement, which
        # subsumes the syntax check. test_helpers.sql (included by both)
        # is excluded for the same reason, and so are cost.sql and
        # rerank.sql: both build an immutable function around a query
        # vector with \gset and \gexec, which is what keeps an InitPlan
        # out of the plans they compare.
        exclude: >-
          ^(sql/|test/pg/(compat/|sql/(prism|mutations|test_helpers|cost|rerank)\.sql$))

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint.json]
        # CHANGELOG.md is generated by git-cliff (long commit-link
        # lines); its format is owned by cliff.toml, not the linter.
        # .release-notes-template.md is a fragment spliced into
        # CHANGELOG.md under an existing heading (no h1 by design).
        exclude: ^(CHANGELOG\.md|\.release-notes-template\.md)$

  # Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
