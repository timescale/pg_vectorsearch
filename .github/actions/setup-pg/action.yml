# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
---
name: Setup PostgreSQL
description: >-
  Build (cached) and install a PostgreSQL with assertions, randomized
  allocations, and injection points -- optionally instrumented with a
  sanitizer -- plus the injection_points test extension, then add it to
  PATH. Shared by every CI job that needs more than the packaged PostgreSQL
  offers.

inputs:
  pg-version:
    description: PostgreSQL version to build.
    required: false
    default: '18.4'
  sanitizer:
    description: >-
      Sanitizer to build PostgreSQL with (passed to -fsanitize=), e.g.
      address or undefined. Omit for a plain debug build -- needed because a
      sanitizer-instrumented extension .so cannot be safely dlopen()'d into
      a non-instrumented backend, so testing the extension itself under a
      sanitizer needs both sides instrumented consistently.
    required: false
    default: ''
  prefix:
    description: >-
      Install prefix for the built PostgreSQL. Defaults to a debug- or
      sanitizer-specific path so a debug build and any number of sanitizer
      builds can all be cached side by side without colliding.
    required: false
    default: ''

outputs:
  pg-config:
    description: Path to the built pg_config.
    value: ${{ steps.resolve-prefix.outputs.prefix }}/bin/pg_config

runs:
  using: composite
  steps:
    - name: Resolve install prefix
      id: resolve-prefix
      shell: bash
      env:
        SANITIZER: ${{ inputs.sanitizer }}
        PREFIX_INPUT: ${{ inputs.prefix }}
      run: |
        if [[ -n "$PREFIX_INPUT" ]]; then
          prefix="$PREFIX_INPUT"
        elif [[ -n "$SANITIZER" ]]; then
          prefix="$GITHUB_WORKSPACE/pg-sanitized-$SANITIZER"
        else
          prefix="$GITHUB_WORKSPACE/pg-debug"
        fi
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

    # The build only changes when the version, sanitizer, or build script
    # changes, so key the cache on all three. Built once, then restored
    # across every workflow that uses this action.
    - name: Cache PostgreSQL
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.resolve-prefix.outputs.prefix }}
        key: >-
          pg-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pg-version }}-${{ inputs.sanitizer || 'debug' }}-${{ hashFiles('scripts/ci/build-pg.sh') }}

    # build-pg.sh configures with --enable-tap-tests, whose configure check
    # requires IPC::Run, and running the TAP tests later needs it too.
    # Install it here so every workflow that uses this action has it -- at
    # both build time (cache miss) and test time (cache hit), so it is not
    # gated on the cache.
    - name: Install TAP perl dependency (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libipc-run-perl

    - name: Build PostgreSQL
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PG_VERSION: ${{ inputs.pg-version }}
        PG_PREFIX: ${{ steps.resolve-prefix.outputs.prefix }}
        SANITIZER: ${{ inputs.sanitizer }}
      run: scripts/ci/build-pg.sh "$PG_VERSION" "$PG_PREFIX" "$SANITIZER"

    - name: Add PostgreSQL to PATH
      shell: bash
      env:
        PG_PREFIX: ${{ steps.resolve-prefix.outputs.prefix }}
      # PG_PREFIX is a trusted, workflow-defined install path, not external input.
      run: echo "$PG_PREFIX/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
