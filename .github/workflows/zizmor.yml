# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Zizmor

# zizmor runs on every pull request, with no path filtering at either
# level. Its findings reach the merge gate as a code scanning analysis
# rather than through this job's exit status, and that analysis exists
# only for commits where zizmor actually ran. A run that skipped
# uploads nothing, so the `zizmor` check never reports and a ruleset
# requiring it waits on it forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow Security Check
    runs-on: ubuntu-latest

    permissions:
      security-events: write  # Required to upload SARIF results (if available)
      contents: read          # Required to checkout repository

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@135698455da5c3b3e55f73f4419e481ab68cdd95 # v0.4.1
        # yamllint disable-line rule:comments-indentation
        # Inputs defined in action.yml, IDE schema may not recognize them
        with:
          persona: pedantic
          online-audits: false     # Disable online audits (require special API access)
          advanced-security: ${{ vars.CODE_SCANNING_ENABLED == 'true' }}
