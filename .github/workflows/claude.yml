# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
# Mention @claude in an issue, a pull request review, or a comment on either,
# and the assistant answers in that thread: it can read the repository and the
# PR's CI results, and commit to a branch when asked to make a change.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # Check out repository

jobs:
  claude:
    name: Claude Code Assistant
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # The write scopes are what let the assistant answer at all: it posts a
    # tracking comment and its reply, and commits to a branch when asked. They
    # grant nothing the caller lacks -- the action requires the invoking actor
    # to hold write or admin before any model call and rejects non-human
    # actors -- and main's ruleset still requires a pull request with no bypass
    # actors, so contents: write reaches branches, not main.
    permissions:
      contents: write       # Commit to a branch when asked to make a change
      pull-requests: write  # Post the reply and tracking comment
      issues: write         # Same, on issues
      id-token: write       # OIDC token for Claude API
      actions: read         # Read CI results on PRs

    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        # v1
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          # Commits go through the GitHub API, not `git push`: the checkout
          # sets persist-credentials: false, so the runner holds no git
          # credentials. Signed commits are a side benefit.
          use_commit_signing: true
