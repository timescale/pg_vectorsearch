# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
# Mention @claude in a pull request review, or in a comment on an issue or a
# pull request, and the assistant answers in that thread: it can read the
# repository and the PR's CI results, and commit to a branch when asked to
# make a change.
#
# The assistant acts with a token of the Claude GitHub App, minted through
# OIDC, not with this job's token. What it can do is therefore set by the
# App's installation permissions on the repository, which an administrator
# reviews there; the job's own scopes below are read-only.
name: Claude Code

# zizmor flags these triggers as dangerous because they run on text anyone can
# write. The action checks that the mentioning actor has write access before
# it reads anything, which is the control that makes them acceptable here.
on: # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read  # Check out repository

jobs:
  claude:
    name: Claude Code Assistant
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # Job-level, not workflow-level: a workflow-level group is entered by
    # every triggering event regardless of this job's own `if`, including
    # the tracking comment this job posts on start ("Reviewing PR #N..."),
    # which is itself a new issue_comment on the same issue/PR -- so it
    # would resolve to the same group key below and cancel the review that
    # posted it, every time, on every thread. A skipped job (this `if`
    # false) never enters a job-level group at all, so only a second
    # genuine @claude invocation on the same thread can still supersede
    # the one in flight.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # Read-only: replies, tracking comments and commits go through the App
    # token (see the top of the file), so write scopes here would grant
    # nothing the assistant uses. The action checks that the mentioning actor
    # holds write access before any model call, and main's ruleset requires a
    # pull request, so the App's contents write reaches branches, not main.
    permissions:
      contents: read        # Check out the repository
      pull-requests: read   # Read the pull request
      issues: read          # Read the issue
      id-token: write       # OIDC exchange for the App token
      actions: read         # Read CI results on PRs

    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        # v1
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          # Commits go through the GitHub API, not `git push`: the checkout
          # sets persist-credentials: false, so the runner holds no git
          # credentials. Signed commits are a side benefit.
          use_commit_signing: true
