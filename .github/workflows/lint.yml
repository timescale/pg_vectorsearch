# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Full history: the commit-message check below walks the PR's
          # commit range, which a shallow checkout cannot resolve.
          fetch-depth: 0

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/check-commit-messages.sh "$BASE_SHA..$HEAD_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc clang-format clang-tidy shellcheck libgsl-dev curl ca-certificates
          # PostgreSQL headers, so `meson setup` configures the extension and
          # src/pg lands in compile_commands.json -- without them clang-tidy has
          # no compile command for those files. From pgdg because the distro
          # ships PG 16 and meson requires 18+. gcc rather than clang because
          # meson.build requires the compiler family to match `pg_config --cc`
          # and pgdg's PostgreSQL is built with gcc; clang-tidy reads the
          # resulting gcc compile commands without complaint.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          pip install pre-commit
          npm install -g markdownlint-cli2

      - name: Run lint checks
        run: ./scripts/ci/lint.sh
