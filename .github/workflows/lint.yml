# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Full history: the commit-message check below walks the PR's
          # commit range, which a shallow checkout cannot resolve.
          fetch-depth: 0

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/check-commit-messages.sh "$BASE_SHA..$HEAD_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang clang-format clang-tidy shellcheck libgsl-dev
          pip install pre-commit
          npm install -g markdownlint-cli2

      - name: Run lint checks
        env:
          CC: clang
        run: ./scripts/ci/lint.sh
