# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: Release

# Publishes a release when a release PR lands.
#
# Triggered by VERSION changing, gated on what it changed to. Nothing
# touches that file except a version bump, and there are exactly two
# kinds: a release (0.2.0-dev -> 0.2.0, proceed) and reopening the
# development cycle (0.2.0 -> 0.3.0-dev, stop). The suffix test is
# therefore a precise partition of the only two things that can happen
# to it, rather than a heuristic over a noisy path.
#
# CHANGELOG.md is deliberately not a trigger. It would work today, but
# only by convention -- if PRs ever append to it during a cycle it
# becomes a high-noise path firing this workflow on every merge.
# VERSION cannot degrade that way.
on:
  push:
    branches:
      - main
      - '[0-9]*.[0-9]*.x'
    paths:
      - 'VERSION'
  # For re-running a release that failed after the push event was
  # consumed. Both inputs are required: the commit is named rather than
  # taken from whichever ref the operator happened to select, since that
  # ref's tip may have moved -- or be an unmerged release branch.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release (must match VERSION)'
        required: true
        type: string
      sha:
        description: 'Commit to release (must be on main or an X.Y.x branch)'
        required: true
        type: string
      # Whether the Releases entry goes public at the end of this run
      # or waits for someone to read it. The tag is pushed and the
      # assets attached either way, and the development-cycle bump
      # still lands, so this decides publication and nothing else.
      #
      # Three values because this input is the most specific of three
      # sources. `default` hands the decision on to the release
      # commit's Keep-Draft trailer and then to the RELEASE_KEEP_DRAFT
      # variable; `yes` and `no` are whoever started this run
      # overruling both -- `no` included, since asking for publication
      # is a different thing from having no opinion.
      keep_draft:
        description: 'Leave the release unpublished'
        required: false
        default: default
        type: choice
        options: [default, 'yes', 'no']

# Not cancel-in-progress: cancelling between the tag and the Releases
# entry is exactly what should not happen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Decide whether VERSION should be released
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
      next_version: ${{ steps.gate.outputs.next_version }}
      sha: ${{ inputs.sha || github.sha }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The named commit on a dispatched run, the pushed one
          # otherwise.
          ref: ${{ inputs.sha || github.sha }}
          # Full depth and tags: the gate asks whether this version is
          # already tagged, compares the on-disk format against the
          # previous release tag, and checks the commit is on a release
          # branch.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decide whether this commit is a finished release
        id: gate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/ci/release-gate.sh "$INPUT_VERSION"

      # Everything downstream writes as the release App, so a release
      # that cannot mint its token is already lost -- better to say so
      # here than after the build job has spent ten minutes.
      - name: Check the release App is configured
        if: >-
          ${{ steps.gate.outputs.release == 'true'
          && vars.RELEASE_APP_CLIENT_ID == '' }}
        run: |
          echo "::error::RELEASE_APP_CLIENT_ID is unset. The release" \
            "pipeline writes as the release App: GitHub raises no" \
            "events for what GITHUB_TOKEN creates, so a tag or pull" \
            "request it made could drive nothing." >&2
          exit 1

  build:
    name: Build and test the commit that will be tagged
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The exact commit the gate approved, so the tag lands on what
          # this job tested -- not whatever main moved to since.
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build gcc gdb make bison flex libgsl-dev \
            libipc-run-perl libopenblas-dev

      - name: Setup debug PostgreSQL
        id: pg
        uses: ./.github/actions/setup-pg
        with:
          pg-version: '18.4'

      - name: Build and test
        env:
          PG_CONFIG: ${{ steps.pg.outputs.pg-config }}
        run: |
          ./scripts/ci/build.sh builddir \
            -Dpostgresql=enabled -Dtools=enabled \
            "-Dpg_config=$PG_CONFIG"

      # Before anything is tagged, so a tarball that will not build
      # cannot become a published release. The archive is unpacked and
      # put through the same configure, compile, install and test
      # sequence as any build, so the PG extension inside it is
      # exercised too and not just the core build. `meson dist` writes
      # a .sha256sum beside the tarball, so there is nothing to add
      # around it.
      - name: Package the source tarball
        env:
          PG_CONFIG: ${{ steps.pg.outputs.pg-config }}
        run: |
          ./scripts/ci/release-package.sh builddir \
            -Dpostgresql=enabled -Dtools=enabled \
            "-Dpg_config=$PG_CONFIG"

      # The publishing job has neither the toolchain nor a builddir, so
      # the assets travel as an artifact rather than being rebuilt.
      - name: Hand the assets to the publishing job
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: release-assets
          path: builddir/meson-dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag the commit and stage its GitHub Releases entry
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      # Only what checkout needs. Every write goes through the App
      # token, so the tag this job creates is one GitHub will raise
      # events for -- which GITHUB_TOKEN's would not be.
      contents: read

    steps:
      - name: Mint a token for the release App
        id: token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          # The client id, not the numeric app id: the action
          # deprecates app-id in favour of it.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped to this repository and to the one thing this job
          # does: create a tag and a draft release. It writes as the
          # App rather than GITHUB_TOKEN because GitHub raises no
          # events for what that token creates, so a tag it pushed
          # could never drive anything.
          permission-contents: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Collect the assets the build job packaged
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist/

      - name: Create tag v<version> and a draft entry with its notes
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
        run: ./scripts/ci/release-create.sh "$VERSION" "$TARGET_SHA"

      # Publishing freezes the assets, so the files go on while the
      # entry is still a draft. Attaching them afterwards is what an
      # immutable release refuses, and no re-run can repair it: the tag
      # is spent even if the empty release is deleted. The publish
      # itself is the last job of all.
      - name: Attach the tarball and its checksum to the draft
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: ./scripts/ci/release-publish.sh "$VERSION" dist --keep-draft

  # Ahead of the publish, so a bump that cannot be opened leaves a
  # draft rather than a released version nothing can bump past.
  #
  # Its own workflow, so it can also be dispatched alone when the bump
  # is the only thing left outstanding -- re-dispatching the pipeline
  # would reach it too, but only after a build that finds nothing to
  # do.
  dev-cycle:
    name: Reopen the development cycle
    needs: [gate, release]
    uses: ./.github/workflows/release-dev-cycle.yml
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      released: ${{ needs.gate.outputs.version }}
      next: ${{ needs.gate.outputs.next_version }}
      base: ${{ github.ref_name }}
      sha: ${{ needs.gate.outputs.sha }}

  # Last, and deliberately so: publishing is the one step with no undo,
  # because it signs an attestation over the tag, the commit and the
  # asset digests, and from then on the assets are frozen and the tag
  # name can never be reused. Every reversible thing -- building,
  # testing, packaging, tagging, attaching, and reopening the
  # development cycle -- has therefore already succeeded by the time
  # this runs. Anything that fails before it leaves a draft, which can
  # be published by hand, re-run, or deleted without spending the
  # version.
  publish:
    name: Publish the release
    needs: [gate, build, release, dev-cycle]
    # Unconditional: the job runs and decides for itself, which is
    # what lets a re-run finish a draft an earlier run left behind. A
    # job that skipped instead would be unreachable -- a skipped job is
    # not a failed one, and nothing re-runs it. Running either way also
    # puts the decision, and the reason for it, in the log.
    runs-on: ubuntu-latest
    permissions:
      contents: read # only what checkout needs; the App does the write

    steps:
      - name: Mint a token for the release App
        id: token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          # The client id, not the numeric app id: the action
          # deprecates app-id in favour of it.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Contents alone: this job publishes the draft and
          # attaches nothing else.
          permission-contents: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Collect the assets the build job packaged
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist/

      # The same script, without --keep-draft, so it decides for
      # itself. It re-attaches and re-reads the asset list before
      # flipping the draft, so what is sealed is verified in the same
      # job that seals it rather than trusted from an earlier one.
      - name: Verify the assets once more, then publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          # Empty on a push, which is how the trailer and the variable
          # get their turn. Through the environment rather than
          # interpolated into the shell.
          KEEP_DRAFT_INPUT: ${{ inputs.keep_draft }}
          KEEP_DRAFT_DEFAULT: ${{ vars.RELEASE_KEEP_DRAFT }}
        run: ./scripts/ci/release-publish.sh "$VERSION" dist
