# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: Release

# Publishes a release when a release PR lands.
#
# Triggered by VERSION changing, gated on what it changed to. Nothing
# touches that file except a version bump, and there are exactly two
# kinds: a release (0.2.0-dev -> 0.2.0, proceed) and reopening the
# development cycle (0.2.0 -> 0.3.0-dev, stop). The suffix test is
# therefore a precise partition of the only two things that can happen
# to it, rather than a heuristic over a noisy path.
#
# CHANGELOG.md is deliberately not a trigger. It would work today, but
# only by convention -- if PRs ever append to it during a cycle it
# becomes a high-noise path firing this workflow on every merge.
# VERSION cannot degrade that way.
on:
  push:
    branches:
      - main
      - '[0-9]*.[0-9]*.x'
    paths:
      - 'VERSION'
  # For re-running a release that failed after the push event was
  # consumed. Both inputs are required: the commit is named rather than
  # taken from whichever ref the operator happened to select, since that
  # ref's tip may have moved -- or be an unmerged release branch.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release (must match VERSION)'
        required: true
        type: string
      sha:
        description: 'Commit to release (must be on main or an X.Y.x branch)'
        required: true
        type: string

# Not cancel-in-progress: cancelling between the tag and the Releases
# entry is exactly what should not happen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Decide whether VERSION should be released
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
      next_version: ${{ steps.gate.outputs.next_version }}
      sha: ${{ inputs.sha || github.sha }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The named commit on a dispatched run, the pushed one
          # otherwise.
          ref: ${{ inputs.sha || github.sha }}
          # Full depth and tags: the gate asks whether this version is
          # already tagged, compares the on-disk format against the
          # previous release tag, and checks the commit is on a release
          # branch.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check it is untagged and its CHANGELOG entry is finished
        id: gate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/ci/release-gate.sh "$INPUT_VERSION"

  build:
    name: Build and test the commit that will be tagged
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The exact commit the gate approved, so the tag lands on what
          # this job tested -- not whatever main moved to since.
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build gcc gdb make bison flex libgsl-dev \
            libipc-run-perl libopenblas-dev

      - name: Setup debug PostgreSQL
        id: pg
        uses: ./.github/actions/setup-pg
        with:
          pg-version: '18.4'

      - name: Build and test
        env:
          PG_CONFIG: ${{ steps.pg.outputs.pg-config }}
        run: |
          ./scripts/ci/build.sh builddir \
            -Dpostgresql=enabled -Dtools=enabled \
            "-Dpg_config=$PG_CONFIG"

      # Before anything is tagged, so a tarball that will not build
      # cannot become a published release. The archive is unpacked and
      # put through the same configure, compile, install and test
      # sequence as any build, so the PG extension inside it is
      # exercised too and not just the core build. `meson dist` writes
      # a .sha256sum beside the tarball, so there is nothing to add
      # around it.
      - name: Package the source tarball
        env:
          PG_CONFIG: ${{ steps.pg.outputs.pg-config }}
        run: |
          ./scripts/ci/release-package.sh builddir \
            -Dpostgresql=enabled -Dtools=enabled \
            "-Dpg_config=$PG_CONFIG"

      # The publishing job has neither the toolchain nor a builddir, so
      # the assets travel as an artifact rather than being rebuilt.
      - name: Hand the assets to the publishing job
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: release-assets
          path: builddir/meson-dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag the commit and create its GitHub Releases entry
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything. gh release create makes the
      # tag as well as the release, so no push permission is needed.
      contents: write # create the tag and the GitHub release

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Collect the assets the build job packaged
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist/

      - name: Create tag v<version> and a Releases entry with its notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
        run: ./scripts/ci/release-create.sh "$VERSION" "$TARGET_SHA"

      # After the entry exists, so a failed upload leaves a release
      # missing its files rather than a tag with no release at all.
      # --clobber lets a re-run replace them instead of failing on a
      # name clash.
      - name: Attach the tarball and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$REPO"

  # Reopening the cycle needs an identity that is not GITHUB_TOKEN:
  # GitHub starts no workflow runs from events that token creates, so
  # main's required checks would never report on the pull request and
  # nothing could merge it. Skipped when the App is not configured, so
  # the release still publishes and the bump stays the manual step
  # docs/release.md describes.
  dev-cycle:
    name: Reopen the development cycle
    needs: [gate, release]
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Mint a token for the release App
        id: app-token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          # The client id, not the numeric app id: the action
          # deprecates app-id in favour of it.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # No owner or repositories input: that scopes the token to
          # this repository alone, whatever else the App is installed
          # on. The permissions narrow it further to what this job
          # does, so an App shared with other release automation
          # hands this job no more than it needs.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          # The App's token is used explicitly below rather than left
          # in the checkout, so no credential outlives this job's
          # push.
          persist-credentials: false

      - name: Open the pull request that bumps VERSION
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASED: ${{ needs.gate.outputs.version }}
          NEXT: ${{ needs.gate.outputs.next_version }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
        run: |
          # Attribute the commit to the App's own bot account. An
          # unattributed commit can draw the ruleset's extra-approval
          # requirement, which would stall the bump.
          bot_id="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "$APP_SLUG[bot]"
          git config user.email \
            "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:$GH_TOKEN@github.com/$REPO"
          ./scripts/ci/release-open-dev-cycle.sh \
            "$RELEASED" "$NEXT" "$BASE"
