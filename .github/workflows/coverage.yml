# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'sql/**'
      - '*.control'
      - 'meson.build'
      - 'VERSION'
      - 'meson_options.txt'
      - 'scripts/ci/coverage.sh'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'sql/**'
      - '*.control'
      - 'meson.build'
      - 'VERSION'
      - 'meson_options.txt'
      - 'scripts/ci/coverage.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # For posting coverage comments
      pages: write          # For deploying to GitHub Pages
      id-token: write       # For GitHub Pages attestation

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build gcc gcovr make bison flex libgsl-dev

      - name: Setup debug PostgreSQL
        id: pg
        uses: ./.github/actions/setup-pg-debug
        with:
          pg-version: '18.4'

      - name: Core dumps
        uses: ./.github/actions/coredumps

      - name: Build with coverage
        env:
          PG_CONFIG: ${{ steps.pg.outputs.pg-config }}
        run: ./scripts/ci/coverage.sh

      - name: Extract coverage summary
        id: coverage
        env:
          ARTIFACTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOTAL_COVERAGE=$(grep -E '^TOTAL' builddir-cov/meson-logs/coverage.txt | awk '{print $4}')
          echo "total=$TOTAL_COVERAGE" >> "$GITHUB_OUTPUT"

          # Generate PR comment with coverage summary
          {
            echo "## 📊 Coverage Report"
            echo ""
            echo '```'
            cat builddir-cov/meson-logs/coverage.txt
            echo '```'
            echo ""
            echo "**Total Coverage:** $TOTAL_COVERAGE"
            echo ""
            echo "<details>"
            echo "<summary>📁 View detailed coverage by file</summary>"
            echo ""
            echo "Full HTML report available in [artifacts](${ARTIFACTS_URL})"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo "*Coverage report generated by [gcovr](https://gcovr.com/)*"
          } > coverage-summary.txt

      - name: Upload test logs and coverage
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: coverage-report
          path: |
            builddir-cov/meson-logs/
            builddir-cov/meson-logs/coveragereport/
          retention-days: 7

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2
        with:
          header: coverage
          path: coverage-summary.txt

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COVERAGE_TOTAL: ${{ steps.coverage.outputs.total }}
        run: |
          COVERAGE=$(echo "$COVERAGE_TOTAL" | sed 's/%//')
          COLOR="red"
          if (( $(awk -v c="$COVERAGE" 'BEGIN {print (c >= 90)}') )); then
            COLOR="brightgreen"
          elif (( $(awk -v c="$COVERAGE" 'BEGIN {print (c >= 80)}') )); then
            COLOR="green"
          elif (( $(awk -v c="$COVERAGE" 'BEGIN {print (c >= 70)}') )); then
            COLOR="yellow"
          elif (( $(awk -v c="$COVERAGE" 'BEGIN {print (c >= 60)}') )); then
            COLOR="orange"
          fi

          # Generate badge JSON for shields.io endpoint
          mkdir -p gh-pages
          cat > gh-pages/coverage-badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "$COVERAGE_TOTAL",
            "color": "$COLOR"
          }
          EOF

      - name: Prepare GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Copy coverage HTML report to coverage/ directory
          cp -r builddir-cov/meson-logs/coveragereport gh-pages/coverage

          # Create index page with redirect
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>pg_vectorsearch Coverage Report</title>
            <meta http-equiv="refresh" content="0; url=coverage/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="coverage/index.html">coverage report</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Check Codecov token
        id: codecov-check
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Codecov upload skipped. Add CODECOV_TOKEN secret to enable."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Codecov
        if: steps.codecov-check.outputs.available == 'true'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: builddir-cov/meson-logs/
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
