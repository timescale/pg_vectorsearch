# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'meson.build'
      - 'VERSION'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'meson.build'
      - 'VERSION'
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am (always runs)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    # Set repository variable CODE_SCANNING_ENABLED=true to enable
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest

    permissions:
      security-events: write  # Required to upload CodeQL results
      actions: read           # Required for workflow run graph
      contents: read          # Required to checkout repository

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2b983b380ce715a6c836c917154509c332c19b3a # v3
        with:
          languages: c-cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18

      # -Dpostgresql=enabled, not the `auto` default: auto treats a missing
      # pg_config as "skip the extension" and only warns, so the analysis
      # would quietly cover src/index and friends while omitting src/pg --
      # the code that runs inside the server. enabled makes that a build
      # failure instead. CodeQL databases only what it watches compile, so
      # what this step builds is exactly what gets analysed.
      - name: Build
        run: |
          meson setup builddir -Dpostgresql=enabled
          meson compile -C builddir

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2b983b380ce715a6c836c917154509c332c19b3a # v3
