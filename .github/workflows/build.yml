# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
---
name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'sql/**'
      - '*.control'
      - 'meson.build'
      - 'VERSION'
      - 'meson_options.txt'
      - 'scripts/ci/build.sh'
      - 'scripts/ci/build-pg.sh'
      - 'scripts/ci/makefile-check.sh'
      - 'Makefile'
      - '.github/actions/setup-pg/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'sql/**'
      - '*.control'
      - 'meson.build'
      - 'VERSION'
      - 'meson_options.txt'
      - 'scripts/ci/build.sh'
      - 'scripts/ci/build-pg.sh'
      - 'scripts/ci/makefile-check.sh'
      - 'Makefile'
      - '.github/actions/setup-pg/**'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.standalone && 'standalone' || matrix.pg }}${{ matrix.tools == 'disabled' && ' ext-only' || '' }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard job: source-built debug PostgreSQL with assertions,
          # randomized allocations, and injection points (the isolation
          # tests run only here). The build is cached by the setup-pg
          # action. arm64 only: the sanitizers workflow already runs this
          # same suite on x64 (plus ASan/UBSan instrumentation), so an
          # x64 debug job here would just repeat it without adding
          # coverage; arm64 exercises the NEON SIMD path the sanitizer
          # jobs (x64-only) can't reach.
          - runner: ubuntu-24.04-arm
            os: Linux
            arch: arm64
            pg: debug
          # Standalone (no PostgreSQL).
          - runner: ubuntu-latest
            os: Linux
            arch: x64
            standalone: true
          # 32-bit x86. GitHub has no 32-bit runners, so PostgreSQL and the
          # extension are both compiled with gcc -m32 on the x64 runner and
          # the whole suite -- unit, regress, isolation and TAP -- runs as
          # native 32-bit code with a 32-bit size_t, off_t and pointer.
          # Ubuntu's i386 archive is a small multilib allow-list: it has
          # gsl but no OpenBLAS, so this job builds without BLAS. pgdg
          # ships no i386 PostgreSQL, so it is built from source like the
          # arm64 job's, cached under its own variant.
          - runner: ubuntu-latest
            os: Linux
            arch: x86-32
            pg: debug
            cc: gcc -m32
            pkg_suffix: ':i386'
            pkg_config_libdir: /usr/lib/i386-linux-gnu/pkgconfig
          # Compatibility: stock release packages (no asserts/injection).
          - runner: macos-latest
            os: macOS
            arch: arm64
            pg: packaged
          # Extension-only: -Dtools=disabled skips the CLI, standalone
          # library, and unit tests — the default when building from a
          # release tarball. Keeps that build shape working on every PR.
          - runner: ubuntu-latest
            os: Linux
            arch: x64
            pg: packaged
            tools: disabled

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # The 32-bit job needs the i386 package architecture enabled before
      # any :i386 library can be installed, and a multilib gcc.
      - name: Enable 32-bit packages (Linux x86-32)
        if: runner.os == 'Linux' && matrix.arch == 'x86-32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      # Libraries carry the job's package suffix (:i386 on the 32-bit job),
      # so each job links against libraries of its own word size.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          PKG_SUFFIX: ${{ matrix.pkg_suffix }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build gcc gdb make bison flex "libgsl-dev$PKG_SUFFIX" \
            libipc-run-perl

      - name: Install OpenBLAS (Linux x64 only)
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: sudo apt-get install -y libopenblas-dev

      - name: Setup debug PostgreSQL
        id: pg
        if: matrix.pg == 'debug'
        uses: ./.github/actions/setup-pg
        with:
          pg-version: '18.4'
          cc: ${{ matrix.cc }}
          variant: ${{ matrix.arch == 'x86-32' && 'x86-32' || '' }}

      - name: Install PostgreSQL 18 (Linux, packaged)
        if: matrix.pg == 'packaged' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja gsl

      - name: Install PostgreSQL 18 (macOS, packaged)
        if: matrix.pg == 'packaged' && runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"

      - name: Core dumps
        uses: ./.github/actions/coredumps

      - name: Build and test
        env:
          PG_CONFIG: ${{ steps.pg.outputs.pg-config }}
          STANDALONE: ${{ matrix.standalone }}
          TOOLS: ${{ matrix.tools || 'enabled' }}
          MATRIX_CC: ${{ matrix.cc }}
          MATRIX_PKG_CONFIG_LIBDIR: ${{ matrix.pkg_config_libdir }}
        run: |
          # The 32-bit job compiles with the same CC PostgreSQL was built
          # with and resolves pkg-config against the i386 libraries.
          [ -n "$MATRIX_CC" ] && export CC="$MATRIX_CC"
          [ -n "$MATRIX_PKG_CONFIG_LIBDIR" ] && export PKG_CONFIG_LIBDIR="$MATRIX_PKG_CONFIG_LIBDIR"
          if [ -n "$STANDALONE" ]; then
            args="-Dpostgresql=disabled"
          else
            args="-Dpostgresql=enabled"
            [ -n "$PG_CONFIG" ] && args="$args -Dpg_config=$PG_CONFIG"
          fi
          # CI never relies on the 'auto' tools heuristic: full jobs
          # force-enable, the ext-only job force-disables.
          args="$args -Dtools=$TOOLS"
          # Likewise for TAP. Required on the source-built PostgreSQL, which
          # build-pg.sh configures with --enable-tap-tests and installs
          # PostgreSQL::Test from (into its pgxs tree); IPC::Run comes from
          # libipc-run-perl above. Requiring it there means a missing
          # prerequisite fails the build instead of quietly dropping the
          # coverage. The packaged and macOS jobs stay on 'auto', because
          # whether their pgxs trees carry PostgreSQL::Test is a packaging
          # detail this repo does not control.
          if [ -n "$PG_CONFIG" ]; then
            args="$args -Dtap_tests=enabled"
          fi
          ./scripts/ci/build.sh builddir $args

      - name: Show regression diffs and server logs
        if: failure()
        run: |
          for f in builddir/test/pg/regression.diffs; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done
          # Temp-instance server logs carry the crash signal and, on an
          # assert build, the "TRAP: failed Assert(...) File:Line".
          for f in builddir/test/pg/tap_log/*; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done
          for d in builddir/testdb builddir/isolation_testdb; do
            for f in "$d"/log/*; do
              [ -f "$f" ] && echo "=== $f ===" && cat "$f"
            done
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.standalone && 'standalone' || matrix.pg }}
          path: |
            builddir/meson-logs/
            builddir/testdb/log/
            builddir/isolation_testdb/log/
          retention-days: 7

  makefile:
    name: Makefile wrapper PG${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg-version: ['18']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build gcc make bison flex libgsl-dev curl \
            ca-certificates

      - name: Install PostgreSQL (packaged)
        env:
          PG_VERSION: ${{ matrix.pg-version }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y \
            "postgresql-$PG_VERSION" "postgresql-server-dev-$PG_VERSION"
          echo "/usr/lib/postgresql/$PG_VERSION/bin" >> "$GITHUB_PATH"
          # The runner image neither creates a cluster on package
          # install nor starts services; the smoke test needs both.
          # The preinstalled PostgreSQL claims port 5432 in the
          # cluster configs, so the new cluster lands on another port
          # — export it for the check script.
          sudo pg_createcluster "$PG_VERSION" main || true
          sudo pg_ctlcluster "$PG_VERSION" main start
          echo "PGPORT=$(pg_lsclusters -h | awk -v v="$PG_VERSION" '$1 == v {print $3}')" >> "$GITHUB_ENV"

      # `make` + `make install` against the default installed
      # PostgreSQL, artifact checks, and a live CREATE EXTENSION in
      # the packaged cluster.
      - name: Check the Makefile wrapper
        env:
          MAKE_CHECK_SMOKE: '1'
        run: ./scripts/ci/makefile-check.sh
